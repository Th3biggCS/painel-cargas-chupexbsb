<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Renova Bioenergia — Painéis</title>
<style>
:root{--blue:#0057B8;--blue-d:#003D82;--green:#00A651;--green-d:#00793B;--text:#16221c;--muted:#6b6a65;--line:#e4e6e3;--soft:#f4f7f5}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;height:100vh;height:100dvh}
.side{width:268px;flex:0 0 268px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;padding:26px 18px 18px;border-top:5px solid var(--green)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:4px 6px 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand img{width:84px;height:auto;display:block}
.brand b{font-size:15px;letter-spacing:.02em;color:var(--blue-d)}
.brand span{font-size:12px;color:var(--muted);margin-top:-6px}
nav{display:flex;flex-direction:column;gap:10px}
.nbtn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--blue-d);font:inherit;font-weight:800;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:15px 16px 15px 18px;border-radius:12px;cursor:pointer;position:relative;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.nbtn::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:transparent}
.nbtn:hover{background:var(--soft);border-color:#cfd6d1}
.nbtn:focus-visible{outline:3px solid rgba(0,87,184,.35);outline-offset:2px}
.nbtn[aria-current="page"]{background:linear-gradient(120deg,var(--blue-d),var(--blue) 60%,var(--green) 150%);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(0,61,130,.22)}
.nbtn[aria-current="page"]::before{background:var(--green)}
.foot{margin-top:auto;font-size:11.5px;color:var(--muted);text-align:center;padding-top:16px}
.main{flex:1;min-width:0;position:relative;background:#fff}
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;color:var(--muted)}
.welcome img{width:150px;height:auto;opacity:.95}
.welcome h1{margin:6px 0 0;font-size:22px;color:var(--blue-d)}
.welcome p{margin:0;font-size:14px}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
.open-full{position:absolute;left:12px;bottom:12px;z-index:5;font-size:12px;font-weight:700;text-decoration:none;color:var(--blue-d);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none}
.open-full.on{display:inline-block}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:auto;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px 12px;flex-direction:column;gap:10px}
  .brand{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;padding:0 0 10px;margin:0}
  .brand img{width:38px}
  .brand span{display:none}
  .brand b{font-size:14px}
  nav{flex-direction:row;gap:8px}
  .nbtn{flex:1;text-align:center;padding:12px 6px;font-size:12px;letter-spacing:.03em}
  .nbtn::before{display:none}
  .foot{display:none}
  .welcome img{width:110px}
  .open-full{left:10px;bottom:10px}
}
@media print{.side,.open-full{display:none!important}.app{display:block;height:auto}}
</style>
</head>

      <h1>Painéis Renova Bioenergia</h1>
      <p>Escolha uma opção no menu para abrir o painel.</p>

    <iframe id="f-operacao-florestal" title="Operação Florestal" data-src="operacao-florestal/index.html"></iframe>
    <iframe id="f-transporte" title="Transporte" data-src="transporte/index.html"></iframe>
    <a class="open-full" id="openFull" target="_blank" rel="noopener">Abrir em tela cheia ↗</a>
  </main>
</div>
<script>
const KEYS = ['operacao-florestal', 'transporte'];
const btns = [...document.querySelectorAll('.nbtn')];
function show(k, push) {
  if (KEYS.indexOf(k) < 0) { k = null; }
  btns.forEach(b => b.getAttribute('data-k') === k ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  KEYS.forEach(x => {
    const f = document.getElementById('f-' + x);
    if (x === k) { if (!f.getAttribute('src')) f.setAttribute('src', f.getAttribute('data-src')); f.classList.add('on'); } else f.classList.remove('on');
  });
  document.getElementById('welcome').style.display = k ? 'none' : '';
  const o = document.getElementById('openFull');
  if (k) { o.href = document.getElementById('f-' + k).getAttribute('data-src'); o.classList.add('on'); } else o.classList.remove('on');
  if (push) { try { history.replaceState(null, '', k ? '#' + k : location.pathname); } catch (e) {} }
  document.title = (k ? btns.find(b => b.getAttribute('data-k') === k).textContent + ' — ' : '') + 'Renova Bioenergia';
}
btns.forEach(b => b.addEventListener('click', () => show(b.getAttribute('data-k'), true)));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
show(location.hash.slice(1), false);
</script>
